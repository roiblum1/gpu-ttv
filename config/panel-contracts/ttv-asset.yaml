  audience: Stage owners, engineers
  decision: How many GPUs this server should account for.
  definition: 'assets.gpu_count: GPUs inventory reports (E).'
  unit: GPUs
  numerator: assets.gpu_count
  denominator: null
  population: One asset.
  window: now
  filters:
  - asset_id
  exclusions: null
  query: grafana/dashboards/ttv-asset.json#2
  lineage:
  - assets.gpu_count
  freshness: Latest engine scan (5 min cadence).
  baseline: null
  direction: neutral
  thresholds: null
  uncertainty: null
  missing_data: '''unread'' = GPU inventory not read, never 0.'
  value_kind: observed
  gate: core
  privileges: SELECT on assets
  cardinality: one value
  drilldown: null
  action: null
  fixture: tests/test_dashboards_gpu_use_asset_pg.py
