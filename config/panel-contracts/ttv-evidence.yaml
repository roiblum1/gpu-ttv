- id: 30
  title: 'Profile-less collector: managers'
  question: E18
  status: built
  audience: Operators, platform team
  decision: Whether the profile-less collector's managers are read and fresh.
  definition: 'one row per UCS Central / OpenManage manager in TTV_MANAGERS_FILE, or read by the collector
    and not since removed from it (ADR-0004). State: never read; ok; latest read incomplete (no server
    can be retired); stale (no complete read within 1 h, the TTV_COLLECTOR_STALE_AFTER default: its collector-only
    servers are UNKNOWN); never complete. Counts come from the latest complete read: servers listed, servers
    with GPUs, servers whose GPU inventory could not be read, servers whose profile binding is ambiguous.'
  unit: servers
  numerator: null
  denominator: null
  population: 'Every GPU asset in the ledger: server-scan servers and servers only the profile-less collector
    knows.'
  window: now
  filters: []
  exclusions: null
