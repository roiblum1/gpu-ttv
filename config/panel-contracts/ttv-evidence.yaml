# Panel contracts for grafana/dashboards/ttv-evidence.json (schema: README.md in this folder).
dashboard: ttv-evidence
panels:
- id: 40
  title: Data age
  question: E18
  status: built
  audience: CEO, stage owners
  decision: Whether the 'now' numbers are current.
  definition: time since the newest engine scan that finished ok or partial. Every 'now' number on this
    page is as of that scan. Green within 15 min (3 scans), orange within 1 h, red beyond.
  unit: seconds
  numerator: now() − max(scan_runs.finished_at) of ok/partial scans
  denominator: null
  population: 'Every GPU asset in the ledger: server-scan servers and servers only the profile-less collector
    knows.'
  window: now
  filters: []
  exclusions: null
  query: grafana/dashboards/ttv-evidence.json#40
  lineage:
  - scan_runs
  freshness: Itself.
  baseline: null
  direction: lower_is_better
  thresholds: green < 15 min, orange < 1 h, red ≥ 1 h
  uncertainty: null
  missing_data: '''no scan yet'' before the first scan.'
  value_kind: observed
  gate: core
  privileges: SELECT on scan_runs
  cardinality: 1 value
  drilldown: ttv-evidence
  action: null
  fixture: null
  expected: null
- id: 41
  title: Known state
  question: E18
  status: built
  audience: Operators, platform team, CEO
  decision: How much of the fleet the numbers describe, and how many GPUs they cannot.
  definition: share of all GPUs in the ledger now whose state is known (not UNKNOWN). Below 90% many totals
    elsewhere are lower bounds; the tables below say why.
  unit: percent
  numerator: GPUs not UNKNOWN now
  denominator: all GPUs now
  population: 'Every GPU asset in the ledger: server-scan servers and servers only the profile-less collector
    knows.'
  window: now
  filters:
  - site
  exclusions: null
  query: grafana/dashboards/ttv-evidence.json#41
  lineage:
  - capacity_intervals
  - assets
  freshness: Latest engine scan (every 5 min); the Data age card shows its age.
  baseline: null
  direction: higher_is_better
  thresholds: red < 50 %, orange < 90 %, green ≥ 90 %
  uncertainty: null
  missing_data: '''no scan yet'' before the first scan; an empty scope shows no value, never 100 %.'
  value_kind: derived
  gate: core
  privileges: SELECT on capacity_intervals, assets
  cardinality: 1 value
  drilldown: null
  action: null
  fixture: null
  expected: null
- id: 43
  title: Failing sources
  question: E18
  status: built
  audience: Operators, platform team
  decision: Whether any source is blind right now.
  definition: sources (server-scan, each cluster's kube API and Thanos) whose latest read failed or that
    never succeeded, plus configured collector managers with no complete read within 1 h (TTV_COLLECTOR_STALE_AFTER
    default; a manager removed from TTV_MANAGERS_FILE no longer counts). 0 = every source answered on
    its latest attempt. The tables below name them.
  unit: sources
  numerator: source_state rows failing or never successful + active collector managers (configured, or
    read and not removed) with no complete read within 1 h
  denominator: null
  population: 'Every GPU asset in the ledger: server-scan servers and servers only the profile-less collector
    knows.'
  window: now
  filters: []
  exclusions: null
  query: grafana/dashboards/ttv-evidence.json#43
  lineage:
  - source_state
  - collector_reads
  - collector_managers
  freshness: Latest engine scan (every 5 min); the Data age card shows its age.
  baseline: null
  direction: lower_is_better
  thresholds: green 0, red ≥ 1
  uncertainty: null
  missing_data: '''no source read yet'' before the first scan.'
  value_kind: observed
  gate: core
  privileges: SELECT on source_state, collector_reads, collector_managers
  cardinality: 1 value
  drilldown: ttv-evidence#21
  action: null
  fixture: null
  expected: null
