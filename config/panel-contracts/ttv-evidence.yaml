  lineage:
  - collector_reads
  - collector_servers
  - collector_managers
  freshness: Latest engine scan (every 5 min); the Data age card shows its age.
  baseline: null
  direction: neutral
  thresholds: null
  uncertainty: null
  missing_data: A message names TTV_MANAGERS_FILE / ttv-collector when no manager has been read.
  value_kind: observed
  gate: core
  privileges: SELECT on collector_reads, collector_servers, collector_managers
  cardinality: one row per manager
  drilldown: null
  action: null
  fixture: null
  expected: null
