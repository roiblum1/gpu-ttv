  - id: 12
    title: Idle and overdue GPU-hours in the time range, by stage owner
    question: E03
    status: built
    audience: CEO, stage owners
    decision: Which stage owner accumulated the most idle and overdue time in the period.
    definition: >-
      For every IDLE interval clipped to the time range (open intervals end at now()): idle GPU-h =
      gpus x hours; overdue GPU-h = gpus x hours after stage_entered_at + objective, the objective
      joined on the interval's (stage, policy_version). USD columns value the same hours at the
      selected snapshot. AWS-equivalent value is a comparison (AWS On-Demand, Linux, shared tenancy,
      us-east-1): not a bill, not our cost and not a loss; never added to other money views
      (AGENT.md §10, ADR-0003).
    unit: GPU-h; USD
    numerator: sum(gpus x clipped hours) of IDLE intervals
    denominator: null
    population: Every GPU asset in the ledger (server-scan and the profile-less collector).
    window: selected range
    filters: [site, stage_owner, snapshot]
    exclusions: >-
      Time before an asset was first observed; idle time with no objective is in its own column,
      never 0 overdue.
    query: grafana/dashboards/ttv-queues.json#12
    lineage:
      - capacity_intervals.gpus
      - capacity_intervals.started_at
      - capacity_intervals.ended_at
      - capacity_intervals.stage_entered_at
      - stage_objectives.objective
      - pricing_rates.per_gpu_hour_usd
    freshness: Recomputed at query time from the ledger.
    baseline: null
    direction: lower_is_better
    thresholds: null
    uncertainty: >-
      Stage clocks that began before observation are lower bounds (≥). 'Stage clock' then shows '≥'
      and overdue is a minimum.
    missing_data: >-
      Owners with 0 had no idle GPU-hours in the range; unpriced GPU-h have their own column.
    value_kind: derived
    gate: core
    privileges: >-
      SELECT on capacity_intervals, assets, stage_objectives, gpu_model_aliases, pricing_rates
    cardinality: one row per stage owner (≤ 4)
    drilldown: ttv-queues#14
    action: Ask the owner with the most overdue GPU-h to clear its longest waits.
    fixture: tests/test_dashboards_sql.py
    expected: >-
      AGENT.md §17: Redbull 24 idle / 16 overdue GPU-h (16 / 12 clipped to 00:30–02:30); Serving 12
      idle, 0 overdue.

  - id: 14
    title: Longest waits (current idle stage episodes)
    question: E03
    status: built
    audience: Stage owners, team leads
    decision: Which servers to unblock first and who acts next.
    definition: >-
      One row per asset and current stage episode with open IDLE intervals: idle GPUs, reasons,
      cluster, holder, time in stage, idle GPU-h of the whole episode, and the newest unexpired
      next-action annotation. Top 50, longest first.
    unit: GPUs; days; GPU-h
    numerator: null
    denominator: null
    population: Current idle stage episodes.
    window: now
    filters: [site, stage_owner]
    exclusions: Episode GPU-hours are not limited to the time range.
    query: grafana/dashboards/ttv-queues.json#14
    lineage:
      - capacity_intervals
      - assets.name
      - assets.model
      - next_action_annotations.next_action_owner
      - next_action_annotations.reason
    freshness: Latest engine scan (open intervals); 'Data as of' and 'Data age' show its age.
    baseline: null
    direction: lower_is_better
    thresholds: null
    uncertainty: >-
      Stage clocks that began before observation are lower bounds (≥). Since, days and GPU-h then
      show '≥'.
    missing_data: An empty next-action owner means no annotation, not 'no action needed'.
    value_kind: observed
    gate: core
    privileges: SELECT on capacity_intervals, assets, next_action_annotations
    cardinality: ≤ 50 rows
    drilldown: null
    action: >-
      Contact the stage owner; the next-action owner is display only and never moves GPU-hours.
    fixture: tests/test_dashboards_sql.py
    expected: >-
      The DC server shows '≥' days; the DGX shows next-action owner Network, with the fixture.

  - id: 15
    title: "Reason breakdown now: GPUs by category and reason"
    question: E03
    status: built
    audience: Stage owners, analysts
    decision: Which reasons dominate each category now.
    definition: >-
      GPUs and distinct assets of open intervals by category, reason_code and stage owner, with the
      share of all GPUs in the table.
    unit: GPUs; assets; share
    numerator: null
    denominator: null
    population: Every GPU asset in the ledger (server-scan and the profile-less collector).
    window: now
    filters: [site, stage_owner]
    exclusions: >-
      Selecting an owner keeps only that owner's IDLE rows; rows with no owner show only under All.
    query: grafana/dashboards/ttv-queues.json#15
    lineage:
      - capacity_intervals.category
      - capacity_intervals.reason_code
      - capacity_intervals.stage_owner
      - capacity_intervals.gpus
    freshness: Latest engine scan (open intervals); 'Data as of' and 'Data age' show its age.
    baseline: null
    direction: neutral
    thresholds: null
    uncertainty: null
    missing_data: >-
      A reason absent from the table has 0 GPUs in the latest scan; UNKNOWN rows stay visible.
    value_kind: observed
    gate: core
    privileges: SELECT on capacity_intervals, assets
    cardinality: one row per category, reason and owner (tens)
    drilldown: null
    action: null
    fixture: tests/test_dashboards_sql.py
    expected: GPUs add up to 'GPUs in scope' (40 with the fixture).

  - id: 17
    title: Idle value per hour now (USD, AWS On-Demand)
    question: E03
    status: built
    audience: CEO, finance
    decision: How much comparison value the current queue represents, to weigh unblocking it.
    definition: >-
      Sum over GPUs idle now of the per-GPU-hour rate of each GPU's model in the selected snapshot
      (raw model -> gpu_model_aliases -> pricing_rates). AWS-equivalent value is a comparison (AWS
      On-Demand, Linux, shared tenancy, us-east-1): not a bill, not our cost and not a loss; never
      added to other money views (AGENT.md §10, ADR-0003).
    unit: USD per hour
    numerator: sum(gpus x per_gpu_hour_usd) of open IDLE intervals
    denominator: null
    population: GPUs idle now whose model has a rate in the snapshot.
    window: now
    filters: [site, stage_owner, snapshot]
    exclusions: >-
      Unpriced GPUs (counted in 'Unpriced idle GPUs now'), so the value is a lower bound when that
      count is above 0.
    query: grafana/dashboards/ttv-queues.json#17
    lineage:
      - capacity_intervals.gpus
      - capacity_intervals.gpu_model
      - gpu_model_aliases.canonical
      - pricing_rates.per_gpu_hour_usd
      - pricing_snapshots.publication_date
    freshness: >-
      Latest engine scan (open intervals); 'Data as of' and 'Data age' show its age. The snapshot's
      publication date is shown under the value.
    baseline: null
    direction: lower_is_better
    thresholds: null
    uncertainty: >-
      Per-GPU rate = whole instance price / GPUs; similar GPU names do not prove equal performance.
    missing_data: Nothing priced shows 'nothing priced (see Unpriced idle GPUs)', never $0.
    value_kind: derived
    gate: core
    privileges: >-
      SELECT on capacity_intervals, assets, gpu_model_aliases, pricing_rates, pricing_snapshots
    cardinality: one value
    drilldown: ttv-queues#20
    action: null
    fixture: tests/test_dashboards_sql.py
    expected: >-
      $220/h with the fixture; $80/h for Redbull's 8 idle GPUs (one synthetic instance-hour).

  - id: 18
    title: Unpriced idle GPUs now
    question: E18
    status: built
