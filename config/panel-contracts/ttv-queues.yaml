    filters: [site, stage_owner, snapshot]
    exclusions: Intervals older than every snapshot are unpriced historically.
    query: grafana/dashboards/ttv-queues.json#20
    lineage:
      - capacity_intervals.gpus
      - capacity_intervals.started_at
      - stage_objectives.objective
      - pricing_snapshots.publication_date
      - pricing_rates.per_gpu_hour_usd
    freshness: >-
      Recomputed at query time; importing a newer snapshot never changes the historical columns.
    baseline: null
    direction: lower_is_better
    thresholds: null
    uncertainty: Stage clocks that began before observation are lower bounds (≥).
    missing_data: >-
      Empty value = nothing in that row could be priced; unpriced GPU-h have their own columns.
