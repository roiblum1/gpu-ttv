# Panel contracts for grafana/dashboards/ttv-queues.json (schema: README.md in this folder).
dashboard: ttv-queues
panels:
- id: 21
  title: Idle GPUs
  question: E03
  status: built
  audience: CEO, stage owners
  decision: How much GPU capacity is waiting in a stage queue right now.
  definition: GPUs in open IDLE intervals (the latest engine scan), all stage owners together; the queue
    table splits them by owner.
  unit: GPUs
  numerator: sum(gpus) of open IDLE intervals
  denominator: null
  population: 'Every GPU asset in the ledger: server-scan servers and servers only the profile-less collector
    knows.'
  window: now
  filters:
  - stage_owner
  - site
  exclusions: PRODUCTIVE, NOT_CHARGED and UNKNOWN GPUs.
  query: grafana/dashboards/ttv-queues.json#21
  lineage:
  - capacity_intervals
  - assets
  freshness: Latest engine scan (every 5 min); the Data age card shows its age.
  baseline: null
  direction: lower_is_better
  thresholds: null
  uncertainty: null
  missing_data: Shows 'no scan yet' before the first engine scan; afterwards an empty result is a real
    0. UNKNOWN GPUs are never counted as idle or productive.
  value_kind: observed
  gate: core
  privileges: SELECT on capacity_intervals, assets
  cardinality: 1 value
  drilldown: ttv-queues
  action: Open Queues to see which owner holds them.
  fixture: tests/test_dashboards_sql.py
  expected: Sum of the idle GPUs in the fixture.
- id: 22
  title: Overdue now
  question: E03
  status: built
  audience: CEO, stage owners
  decision: How much idle capacity has broken its stage objective right now.
  definition: idle GPUs whose current stage episode has lasted longer than the stage objective of the
    interval's own policy version. Intervals with no objective are not counted (Selected period shows
    them).
  unit: GPUs
  numerator: sum(gpus) of open IDLE intervals with now() > stage_entered_at + objective
  denominator: null
  population: 'Every GPU asset in the ledger: server-scan servers and servers only the profile-less collector
    knows.'
  window: now
  filters:
  - stage_owner
  - site
  exclusions: Intervals with no objective.
  query: grafana/dashboards/ttv-queues.json#22
  lineage:
  - capacity_intervals
  - assets
  - stage_objectives
  freshness: Latest engine scan (every 5 min); the Data age card shows its age.
  baseline: null
  direction: lower_is_better
  thresholds: null
  uncertainty: Stage clocks that began before observation are lower bounds (≥); waits and GPU-hours derived
    from them are minimums.
  missing_data: Shows 'no scan yet' before the first engine scan; afterwards an empty result is a real
    0. UNKNOWN GPUs are never counted as idle or productive.
  value_kind: observed
  gate: core
  privileges: SELECT on capacity_intervals, assets, stage_objectives
  cardinality: 1 value
  drilldown: null
  action: null
  fixture: null
  expected: null
