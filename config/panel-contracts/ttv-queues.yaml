    lineage: [capacity_intervals.gpus, gpu_model_aliases.canonical, pricing_rates.per_gpu_hour_usd]
    freshness: Latest engine scan (open intervals); 'Data as of' and 'Data age' show its age.
    baseline: null
    direction: lower_is_better
    thresholds: null
    uncertainty: null
    missing_data: Unpriced GPUs are never valued at $0; no idle GPUs in scope gives no value.
    value_kind: observed
    gate: core
    privileges: SELECT on capacity_intervals, assets, gpu_model_aliases, pricing_rates
    cardinality: one value
    drilldown: ttv-queues#19
    action: null
    fixture: tests/test_dashboards_sql.py
    expected: 2 (the A16s) with the fixture.

