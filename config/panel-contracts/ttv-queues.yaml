# Panel contracts for ttv-queues.json (schema: config/panel-contracts/README.md).
# Accurate to the dashboard as committed; update an entry in the same change as its panel.
dashboard: ttv-queues
panels:
  - id: 2
    title: Data as of (last successful scan)
    question: support
    status: built
    audience: Everyone reading the page
    decision: Whether the numbers are fresh enough to act on.
    definition: Finish time of the newest scan_runs row with status 'ok', one value per scan kind.
    unit: timestamp (stored UTC, shown in the dashboard timezone)
    numerator: null
    denominator: null
    population: scan_runs
    window: now
    filters: []
    exclusions: Partial, failed, running and dry_run scans.
    query: grafana/dashboards/ttv-queues.json#2
    lineage: [scan_runs.finished_at, scan_runs.status, scan_runs.kind]
    freshness: Each scan.
    baseline: null
    direction: neutral
    thresholds: null
    uncertainty: null
    missing_data: A kind that never finished an 'ok' scan shows 'No successful scan yet'.
    value_kind: observed
    gate: core
    privileges: SELECT on scan_runs
    cardinality: one value per scan kind (≤ 3)
    drilldown: ttv-evidence#18
    action: If stale, check Evidence for failing sources.
    fixture: tests/test_dashboards_sql.py
    expected: One time per kind (collector, engine) with the fixture.

  - id: 3
    title: Data age
    question: support
    status: built
    audience: Everyone reading the page
    decision: Whether the numbers are fresh enough to act on.
    definition: now() minus the finish time of the newest 'ok' scan, per scan kind.
    unit: duration
    numerator: null
    denominator: null
    population: scan_runs
    window: now
    filters: []
    exclusions: Partial, failed, running and dry_run scans.
    query: grafana/dashboards/ttv-queues.json#3
    lineage: [scan_runs.finished_at, scan_runs.status, scan_runs.kind]
    freshness: Each scan.
    baseline: null
    direction: lower_is_better
    thresholds: green < 20 min, orange from 20 min, red from 60 min; purple = never succeeded
    uncertainty: null
    missing_data: A kind with no successful scan shows no value in purple, never an age of 0.
    value_kind: derived
    gate: core
    privileges: SELECT on scan_runs
    cardinality: one value per scan kind (≤ 3)
    drilldown: ttv-evidence#18
    action: If red, check Evidence for failing sources.
    fixture: tests/test_dashboards_sql.py
    expected: About 9 min (engine) and 19 min (collector) with the fixture.

  - id: 4
