  definition: what the idle GPUs now would cost per hour at AWS On-Demand rates (Linux, shared tenancy)
    from the selected price snapshot, shown under the value. A comparison, not a bill, not our cost and
    not a loss (ADR-0003).
  unit: USD per hour
  numerator: sum(gpus × per_gpu_hour_usd) of open IDLE intervals at the selected snapshot
  denominator: null
  population: 'Every GPU asset in the ledger: server-scan servers and servers only the profile-less collector
    knows.'
  window: now
  filters:
  - stage_owner
  - site
  - snapshot
  exclusions: Unpriced GPUs (named in the label).
  query: grafana/dashboards/ttv-queues.json#17
  lineage:
  - capacity_intervals
  - assets
  - pricing_rates
  - pricing_snapshots
  - gpu_model_aliases
  freshness: Latest engine scan (every 5 min); the Data age card shows its age.
  baseline: null
  direction: lower_is_better
  thresholds: null
  uncertainty: AWS-equivalent comparison, not a bill, our cost or a loss (ADR-0003); a per-GPU rate allocates
