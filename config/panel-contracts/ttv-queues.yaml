    question: support
    status: built
    audience: Analysts, stage owners
    decision: Whether open intervals were classified under more than one policy.
    definition: Distinct policy_version of the open ledger intervals.
    unit: text
    numerator: null
    denominator: null
    population: Open capacity_intervals.
    window: now
    filters: []
    exclusions: null
    query: grafana/dashboards/ttv-queues.json#4
    lineage: [capacity_intervals.policy_version]
    freshness: Latest engine scan (open intervals); 'Data as of' and 'Data age' show its age.
    baseline: null
    direction: neutral
    thresholds: null
    uncertainty: null
    missing_data: "'no open intervals' means the engine has not written a scan yet."
    value_kind: observed
    gate: core
    privileges: SELECT on capacity_intervals
    cardinality: one row
    drilldown: null
    action: null
    fixture: tests/test_dashboards_sql.py
    expected: "'fixture-1' with the fixture."

  - id: 5
    title: "Coverage: GPUs UNKNOWN vs total"
    question: E18
    status: built
    audience: CEO, stage owners
    decision: Whether coverage is good enough to trust the queue numbers.
    definition: >-
      GPUs in open UNKNOWN intervals against all GPUs in open intervals, plus servers whose GPU
      count was never read (they have no GPU total, so they are outside 'GPUs in scope').
    unit: GPUs; share
    numerator: sum(gpus) of open UNKNOWN intervals
    denominator: sum(gpus) of all open intervals
    population: Every GPU asset in the ledger (server-scan and the profile-less collector).
    window: now
    filters: [site]
    exclusions: "stage_owner does not apply: UNKNOWN GPUs have no stage owner."
    query: grafana/dashboards/ttv-queues.json#5
    lineage: [capacity_intervals.gpus, capacity_intervals.category, assets.gpu_count, assets.site]
    freshness: Latest engine scan (open intervals); 'Data as of' and 'Data age' show its age.
    baseline: null
    direction: lower_is_better
    thresholds: null
    uncertainty: null
    missing_data: No open intervals for the scope gives no value (purple), never 0.
    value_kind: observed
    gate: core
    privileges: SELECT on capacity_intervals, assets
    cardinality: one row
    drilldown: ttv-evidence#25
    action: Fix the sources behind UNKNOWN GPUs (Evidence).
    fixture: tests/test_dashboards_sql.py
    expected: 4 UNKNOWN of 40 GPUs and 1 server with an unread GPU count with the fixture.

  - id: 7
    title: Idle GPUs now, by stage owner
    question: E03
    status: built
    audience: CEO, stage owners
    decision: Which handoff queue to unblock first.
    definition: >-
      GPUs in open IDLE intervals, summed per stage_owner. Owners seen in the ledger with no idle
      GPUs now show 0 when the scope has open intervals.
    unit: GPUs
    numerator: sum(capacity_intervals.gpus) where category = IDLE and ended_at IS NULL
    denominator: null
    population: Every GPU asset in the ledger (server-scan and the profile-less collector).
    window: now
    filters: [site, stage_owner]
    exclusions: UNKNOWN, PRODUCTIVE and NOT_CHARGED GPUs.
    query: grafana/dashboards/ttv-queues.json#7
    lineage: [capacity_intervals.gpus, capacity_intervals.stage_owner, assets.site]
    freshness: Latest engine scan (open intervals); 'Data as of' and 'Data age' show its age.
    baseline: null
    direction: lower_is_better
    thresholds: null
    uncertainty: Stage clocks that began before observation are lower bounds (≥).
    missing_data: >-
      No open intervals at all shows 'No ledger data yet'; a stale source turns GPUs UNKNOWN, never
      idle.
    value_kind: observed
    gate: core
    privileges: SELECT on capacity_intervals, assets
    cardinality: one row per stage owner (≤ 4)
    drilldown: ttv-queues#14
    action: Ask the stage owner to clear the longest waits (Longest waits).
    fixture: tests/test_dashboards_sql.py
    expected: DC 8, Redbull 8, POPAI 2, Serving 6 with the fixture.

