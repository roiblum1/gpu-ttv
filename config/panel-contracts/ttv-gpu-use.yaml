# Panel contracts for grafana/dashboards/ttv-gpu-use.json (schema: config/panel-contracts/README.md).
# Expected values refer to the synthetic fixture in tests/test_dashboards_gpu_use_asset_pg.py
# (fixture-tested, not production evidence).
dashboard: ttv-gpu-use
panels:
- id: 2
  title: Useful work (% of measured GPUs)
  question: E12
  status: built
  audience: CEO, Serving, POPAI
  decision: Whether measured GPUs are doing useful work or the fleet needs action.
  definition: >-
    Use class per open interval: 1 Useful work (PRODUCTIVE, no allocated_idle), 2 Allocated, inactive
    (PRODUCTIVE + allocated_idle), 3 Waste candidate (NO_REAL_DEMAND, LOW_USE, OTHER_WORKLOAD, NO_WORKLOAD),
    4 Constrained or failed (other IDLE on a matched node), 5 Use unknown (TRAFFIC_UNOBSERVED, HOLDER_UNRESOLVED,
    NODE_NOT_FOUND, CLUSTER_UNREACHABLE, NODE_CLAIM identity conflict), 6 Not measured (everything else).
    Value = class 1 GPUs / classes 1-5 GPUs.
  unit: share of physical GPUs
  numerator: sum(gpus) of open intervals in use class 1
  denominator: sum(gpus) of open intervals in use classes 1-5 (measured)
  population: >-
    Every GPU in an open ledger interval (server-scan and the profile-less collector); 'measured' = GPUs
    whose node is in a target cluster the engine reads.
  window: now
  filters:
  - site
  - cluster
  exclusions: Not-measured GPUs (class 6) are outside the denominator.
  query: grafana/dashboards/ttv-gpu-use.json#2
  lineage:
  - capacity_intervals.category
  - capacity_intervals.reason_code
  - capacity_intervals.flags
  - capacity_intervals.cluster
  - capacity_intervals.evidence
  - capacity_intervals.gpus
  - assets.site
  - identity_conflicts.key
  - identity_conflicts.candidates
  freshness: >-
    Latest engine scan (5 min cadence); 'Data age (engine scan)' shows its age.
  baseline: null
  direction: higher_is_better
  thresholds: null
  uncertainty: >-
    Before I2 is approved any genuine request qualifies (low_use_unverified); counters without a synthetic
    filter are user_attribution_unverified.
  missing_data: >-
    No GPU in a measured cluster shows 'No GPU in a measured cluster', never 0%.
  value_kind: derived
  gate: core
  privileges: SELECT on capacity_intervals, assets, identity_conflicts
  cardinality: one value
  drilldown: ttv-gpu-use#11
  action: Open 'Measured GPUs now, by use class and reason' for the reasons.
  fixture: tests/test_dashboards_gpu_use_asset_pg.py
  expected: 0.125 (2 of 16 measured GPUs) with the fixture.
