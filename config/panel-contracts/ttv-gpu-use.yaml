  missing_data: No measured GPU shows 'No GPU in a measured cluster', never 0.
  value_kind: derived
  gate: core
  privileges: SELECT on capacity_intervals, assets, identity_conflicts
  cardinality: one value
  drilldown: ttv-gpu-use#15
