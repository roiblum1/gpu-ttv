  - capacity_intervals.flags
  - capacity_intervals.cluster
  - capacity_intervals.evidence
  - capacity_intervals.gpus
  - assets.site
  - identity_conflicts.key
  - identity_conflicts.candidates
  freshness: >-
    Latest engine scan (5 min cadence); 'Data age (engine scan)' shows its age.
  baseline: null
  direction: lower_is_better
  thresholds: null
  uncertainty: >-
