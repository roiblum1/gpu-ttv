  numerator: null
  denominator: null
  population: Every GPU asset plus imported incoming supply.
  window: now, plus a dated scenario
  filters: []
  exclusions: Incoming servers are never available today; a GPU is counted in one bucket only.
  query: grafana/dashboards/ttv-capacity.json#2
  lineage:
  - demand import (missing)
  - reservations (missing)
  - orders (missing)
  - fit-check policy (missing)
  - capacity_intervals
  freshness: Static text until the inputs exist; then each scan and import.
  baseline: null
  direction: neutral
  thresholds: null
