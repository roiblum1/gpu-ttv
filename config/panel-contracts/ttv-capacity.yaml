# Panel contracts for ttv-capacity.json (schema: config/panel-contracts/README.md).
# Every panel is a missing-input text card (AGENT.md §0.6): it names the missing inputs and the
# onboarding path and shows no number. value_kind and direction describe the future answer.
dashboard: ttv-capacity
panels:
- id: 1
  title: E06 · When will this batch or project get usable GPUs?
  question: E06
  status: missing_input
  audience: CEO, project owners
  decision: Manage launch promises and escalation timing.
  definition: 'Not built (R3). Will show committed dates against forecast ranges for GPU-ready and user-accessible
    per batch or project, with observed progress, blocking prerequisites and delivery risk. Missing inputs:
    procurement batches and their servers, project capacity requests and approved commitment dates, enough
    completed comparable episodes for a backtested forecast, and calendars where relevant.'
  unit: dates (forecast ranges)
  numerator: null
  denominator: null
  population: Servers in imported batches and projects.
  window: forecast horizon from the as-of time
  filters: []
  exclusions: Incoming servers never count as available today.
  query: grafana/dashboards/ttv-capacity.json#1
  lineage:
  - procurement batches (missing)
  - commitments (missing)
  - milestones
  - capacity_intervals
  freshness: Static text until the imports exist; then each forecast declares its as-of time and expiry.
  baseline: Simple backtested baseline forecast.
  direction: neutral
  thresholds: null
  uncertainty: Forecast ranges with declared method and coverage; scenario bounds are not calibrated intervals.
  missing_data: The card lists the missing inputs, where they come from and the onboarding step; it shows
    no number.
  value_kind: forecast
  gate: business_input
  privileges: None today (static text).
  cardinality: One text panel.
  drilldown: ttv-delivery
  action: Import procurement batches and commitments; join servers by vendor and normalised serial.
  fixture: tests/test_panel_contracts.py
  expected: 'Text card titled ''E06 · When will this batch or project get usable GPUs?'' naming batches,
    commitments and history as missing; no date. When built (§17): an incoming shipment improves a future
    scenario but not current capacity.'
