# Panel contracts for grafana/dashboards/ttv-home.json (schema: README.md in this folder).
dashboard: ttv-home
panels:
- id: 2
  title: Idle GPUs
  question: E03
  status: built
  audience: CEO, stage owners
  decision: How much GPU capacity is waiting in a stage queue right now.
  definition: GPUs in open IDLE intervals (the latest engine scan), all stage owners together; the queue
    table splits them by owner.
  unit: GPUs
  numerator: sum(gpus) of open IDLE intervals
  denominator: null
  population: 'Every GPU asset in the ledger: server-scan servers and servers only the profile-less collector
    knows.'
  window: now
  filters:
  - stage_owner
  - site
  exclusions: PRODUCTIVE, NOT_CHARGED and UNKNOWN GPUs.
  query: grafana/dashboards/ttv-home.json#2
  lineage:
  - capacity_intervals
  - assets
  freshness: Latest engine scan (every 5 min); the Data age card shows its age.
  baseline: null
  direction: lower_is_better
  thresholds: null
  uncertainty: null
  missing_data: Shows 'no scan yet' before the first engine scan; afterwards an empty result is a real
    0. UNKNOWN GPUs are never counted as idle or productive.
  value_kind: observed
  gate: core
  privileges: SELECT on capacity_intervals, assets
  cardinality: 1 value
  drilldown: ttv-queues
  action: Open Queues to see which owner holds them.
  fixture: tests/test_dashboards_sql.py
  expected: Sum of the idle GPUs in the fixture.
- id: 3
  title: Idle value / hour (AWS)
  question: E03
  status: built
  audience: CEO, stage owners
  decision: What the idle capacity would cost at AWS On-Demand, to size the urgency.
  definition: what the idle GPUs now would cost per hour at AWS On-Demand rates (Linux, shared tenancy)
    from the selected price snapshot, shown under the value. A comparison, not a bill, not our cost and
    not a loss (ADR-0003).
  unit: USD per hour
  numerator: sum(gpus × per_gpu_hour_usd) of open IDLE intervals at the selected snapshot
  denominator: null
  population: 'Every GPU asset in the ledger: server-scan servers and servers only the profile-less collector
    knows.'
  window: now
  filters:
  - stage_owner
  - site
  - snapshot
  exclusions: Unpriced GPUs (named in the label).
  query: grafana/dashboards/ttv-home.json#3
  lineage:
  - capacity_intervals
  - assets
  - pricing_rates
  - pricing_snapshots
  - gpu_model_aliases
  freshness: Latest engine scan (every 5 min); the Data age card shows its age.
  baseline: null
  direction: lower_is_better
  thresholds: null
  uncertainty: AWS-equivalent comparison, not a bill, our cost or a loss (ADR-0003); a per-GPU rate allocates
    the whole instance price. GPUs whose model has no rate are left out and the label says 'at least'.
  missing_data: '''unpriced or no snapshot'' when nothing is priced or no snapshot is imported; $0 when
    no GPU is idle.'
  value_kind: derived
  gate: core
  privileges: SELECT on capacity_intervals, assets, pricing_rates, pricing_snapshots, gpu_model_aliases
  cardinality: 1 value
  drilldown: ttv-queues#19
  action: null
  fixture: null
  expected: null
