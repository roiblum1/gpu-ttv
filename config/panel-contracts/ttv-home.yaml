# Panel contracts for grafana/dashboards/ttv-home.json (schema: README.md in this folder).
dashboard: ttv-home
panels:
- id: 1
  title: GPUs wasted now
  question: E03
  status: built
  audience: Senior managers, team leads
  decision: How much GPU capacity is wasted right now.
  definition: 'GPUs in open IDLE intervals (every stage), in the cluster scope. Label: all GPUs in open
    intervals and the UNKNOWN ones.'
  unit: GPUs
  numerator: sum(gpus) of open IDLE intervals
  denominator: null
  population: Every GPU server server-scan lists (the only inventory source, ADR-0008).
  window: now
  filters:
  - cluster
  exclusions: PRODUCTIVE, NOT_CHARGED and UNKNOWN GPUs (UNKNOWN shown in the label).
  query: grafana/dashboards/ttv-home.json#1
  lineage:
  - capacity_intervals.category
  - capacity_intervals.stage
  - capacity_intervals.gpus
  - capacity_intervals.cluster
  - capacity_intervals.evidence
  freshness: Latest engine scan (every 5 min); 'Data as of' on the summary page.
  baseline: null
  direction: lower_is_better
  thresholds: null
  uncertainty: null
  missing_data: Before the first scan, or for a cluster filter that matches no GPU, the value is empty
    ('no data yet'), never 0. After that an empty team is a real 0. GPUs with no data (UNKNOWN) are never
    counted as wasted; their count is in the label.
  value_kind: observed
  gate: core
  privileges: SELECT on capacity_intervals
  cardinality: 1 value
  drilldown: ttv-home#3
  action: null
  fixture: tests/test_dashboards_sql.py
  expected: 48 GPUs; label 'of 114 GPUs · 20 have no data'.
- id: 2
  title: GPU-hours wasted
  question: E03
  status: built
  audience: Senior managers, team leads
  decision: How much waste accumulated in the period.
  definition: 'Σ gpus × overlap of IDLE intervals with the time range (open intervals end at now). Label:
    lower-bound note and UNKNOWN GPU-hours.'
  unit: GPU-hours
  numerator: Σ gpus × hours of IDLE intervals clipped to the range
  denominator: null
  population: Every GPU server server-scan lists (the only inventory source, ADR-0008).
  window: selected range
  filters:
  - cluster
  exclusions: null
  query: grafana/dashboards/ttv-home.json#2
  lineage:
  - capacity_intervals.category
  - capacity_intervals.stage
  - capacity_intervals.gpus
  - capacity_intervals.cluster
  - capacity_intervals.evidence
  freshness: Latest engine scan (every 5 min); 'Data as of' on the summary page.
  baseline: null
  direction: lower_is_better
  thresholds: null
  uncertainty: '''at least'' when the range starts before the first scan.'
  missing_data: 'Empty (''no data yet'') when no interval in the cluster scope overlaps the range. When
    the range starts before the first ok or partial engine scan, the label says ''at least'' (a lower
    bound: time before observation is unknown, never zero).'
  value_kind: observed
  gate: core
  privileges: SELECT on capacity_intervals
  cardinality: 1 value
  drilldown: null
  action: null
  fixture: tests/test_dashboards_sql.py
  expected: '1,808 GPU-hours over the default 7 days, ''in the selected period · 56 GPU-hours have no
    data''; ''at least'' over 30 days; §17: 24 for 8 GPUs idle 3 h, 16 clipped to 2 h, 12 for 6 GPUs idle
    2 h.'
