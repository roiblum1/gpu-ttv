# Panel contracts for grafana/dashboards/ttv-apply.json (schema: README.md in this folder).
dashboard: ttv-apply
panels:
- id: 1
  title: GPUs wasted now
  question: E03
  status: built
  audience: Senior managers, team leads
  decision: How many GPUs Apply is wasting right now.
  definition: 'GPUs in open IDLE intervals with stage = SERVING. Label: the stage''s team name from the
    ledger and the GPUs with no data (UNKNOWN serving workloads in workloads_now).'
  unit: GPUs
  numerator: sum(gpus) of open IDLE intervals with stage = SERVING
  denominator: null
  population: Every GPU server server-scan lists (the only inventory source, ADR-0008).
  window: now
  filters:
  - cluster
  exclusions: null
  query: grafana/dashboards/ttv-apply.json#1
  lineage:
  - capacity_intervals.category
  - capacity_intervals.stage
  - capacity_intervals.gpus
  - capacity_intervals.cluster
  - capacity_intervals.evidence
  - workloads_now
  freshness: Latest engine scan (every 5 min); 'Data as of' on the summary page.
  baseline: null
  direction: lower_is_better
  thresholds: null
  uncertainty: null
  missing_data: Before the first scan, or for a cluster filter that matches no GPU, the value is empty
    ('no data yet'), never 0. After that an empty team is a real 0. GPUs with no data (UNKNOWN) are never
    counted as wasted; their count is in the label.
  value_kind: observed
  gate: core
  privileges: SELECT on capacity_intervals, workloads_now
  cardinality: 1 value
  drilldown: null
  action: null
  fixture: tests/test_dashboards_sql.py
  expected: 8 GPUs; label 'Apply · 4 GPUs have no data'.
