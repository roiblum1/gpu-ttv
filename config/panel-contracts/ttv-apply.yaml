- id: 6
  title: Cost of waste at AWS prices
  question: E03
  status: built
  audience: Senior managers, team leads
  decision: How big Apply's waste in the period is, in money.
  definition: '#2''s wasted GPU-hours of stage SERVING × each interval''s AWS On-Demand per-GPU-hour rate
    at the present-day snapshot.'
  unit: USD
  numerator: Σ gpus × clipped hours × per_gpu_hour_usd
  denominator: null
  population: Every GPU server server-scan lists (the only inventory source, ADR-0008).
  window: selected range
  filters:
  - cluster
  exclusions: null
  query: grafana/dashboards/ttv-apply.json#6
  lineage:
  - capacity_intervals.category
  - capacity_intervals.stage
  - capacity_intervals.gpus
  - capacity_intervals.cluster
  - capacity_intervals.evidence
  - gpu_model_aliases.canonical
  - pricing_rates.per_gpu_hour_usd
  - pricing_selection.snapshot_id
  - pricing_snapshots.publication_date
  freshness: Latest engine scan (every 5 min); 'Data as of' on the summary page.
  baseline: null
  direction: lower_is_better
  thresholds: null
  uncertainty: 'AWS On-Demand equivalent (us-east-1), a comparison, not our bill (ADR-0003): present-day
    valuation, every GPU-hour at one snapshot (pricing_selection, else the latest by publication date
    then capture time). GPU-hours whose model has no rate make it ''at least''.'
  missing_data: 'No snapshot: no value, label ''no AWS price list loaded''. Wasted GPU-hours but none
    priced: no value (''No price''), never $0; the label gives the unpriced GPU-hours. Nothing wasted:
    a real 0.'
  value_kind: benchmark
  gate: core
  privileges: SELECT on capacity_intervals, gpu_model_aliases, pricing_rates, pricing_selection, pricing_snapshots
  cardinality: 1 value
  drilldown: null
  action: null
  fixture: tests/test_dashboards_sql.py
  expected: $2,120 (212 GPU-hours at $10).
