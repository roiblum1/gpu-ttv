  question: E03
  status: built
  audience: Senior managers, team leads
  decision: How big POPAI's waste in the period is, in money.
  definition: '#2''s wasted GPU-hours of stage GPU_PLATFORM × each interval''s AWS On-Demand per-GPU-hour
