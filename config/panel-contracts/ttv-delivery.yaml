    query: grafana/dashboards/ttv-delivery.json#19
    lineage: [assets.gpu_model, assets.site, capacity_intervals.*, milestones.*]
    freshness: Periods end at the last complete UTC day.
    baseline: The prior period of the same length.
    direction: lower_is_better
    thresholds: null
    uncertainty: Small groups mostly read "insufficient history"; deployment method, new vs reused hardware and complexity are not stratified (no R1 source).
    missing_data: No completed sample shows "No completed samples of this clock in either period".
