# Canonical GPU model (src/ttv/pricing/catalog.py) -> AWS EC2 instance for the On-Demand comparison.
# exact = same GPU and memory; proxy = comparable GPU, approved by the user; unpriced = never $0.
# User decisions of 2026-10-31: proxies below approved; size rule kept; V100 16GB stays unpriced.
# Bump map_version on every change: it is part of every snapshot id (docs/adr/0003-aws-pricing.md).
map_version: "2026-10-31.2"
retrieved: "2026-10-31"
size_rule: >-
  The smallest size with at least 4 GPUs of the model, so each GPU carries the least host
  (vCPU, RAM) in the per-GPU split and the size matches 4-8 GPU servers. P families sell only
  one multi-GPU size (8 GPUs).

entries:
