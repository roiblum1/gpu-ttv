  # --- proxy: approved by the user on 2026-10-31 -----------------------------------------------
  - gpu_model: NVIDIA A10 24GB
    kind: proxy
    instance_type: g5.12xlarge
    instance_gpus: 4
    confidence: medium
    reason: >-
      AWS: 4 x NVIDIA A10G, 89 GiB (4 x 22 GiB). The A10G is AWS's variant of the A10 and
      server-scan's catalogue files both under this row, but they are different SKUs.
    sources: [https://docs.aws.amazon.com/ec2/latest/instancetypes/ac.html]
  - gpu_model: NVIDIA A100 (memory unknown)
    kind: proxy
    instance_type: p4d.24xlarge
    instance_gpus: 8
    confidence: low
    reason: >-
      The inventory reports a bare A100 without its memory size (40GB and 80GB both exist).
      Valued at the 40GB (p4d) rate, the lower of the two A100 rates, so the value is a lower
      bound. Teaching server-scan the model (INVENTORY_GPU_MODELS) removes the need.
    sources: [https://docs.aws.amazon.com/ec2/latest/instancetypes/ac.html]
  - gpu_model: NVIDIA H100 NVL 94GB
    kind: proxy
    instance_type: p5.48xlarge
    instance_gpus: 8
    confidence: low
    reason: >-
      No EC2 instance has the H100 NVL; P5's H100 SXM 80GB is the only H100 on EC2. Same GH100
      GPU, but the NVL is a PCIe card with more memory (94 GB) and a lower power limit, so this
      is a comparison at the nearest H100 rate, not a match.
    sources: [https://docs.aws.amazon.com/ec2/latest/instancetypes/ac.html]
  - gpu_model: NVIDIA H100 (memory unknown)
    kind: proxy
    instance_type: p5.48xlarge
    instance_gpus: 8
    confidence: medium
    reason: >-
      The inventory reports a bare H100 without its memory size (80 GB or 94 GB). Every H100
      capacity is valued at P5's H100 rate, so the missing size does not change the value.
    sources: [https://docs.aws.amazon.com/ec2/latest/instancetypes/ac.html]
  - gpu_model: NVIDIA H100 94GB
    kind: proxy
    instance_type: p5.48xlarge
    instance_gpus: 8
    confidence: low
    reason: >-
      Inventory reports an H100 with 94-95 GB (the H100 NVL or a 94 GB board; the name does not
      say which). No EC2 instance has a 94 GB H100; valued at P5's H100 80GB rate, the only H100
      on EC2.
    sources: [https://docs.aws.amazon.com/ec2/latest/instancetypes/ac.html]

