    instance_type: p5.48xlarge
    instance_gpus: 8
    confidence: medium
    reason: >-
      AWS: 8 x NVIDIA H100, 640 GiB (8 x 80 GiB). Same GPU and memory. AWS uses the SXM part;
      a PCIe H100 (fewer SMs, lower memory bandwidth) is valued at the SXM rate.
