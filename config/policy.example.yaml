# Business policy for the GPU Time-to-Value engine. Validated at startup; an invalid file stops the engine.
# Bump policy_version whenever anything below changes: every ledger interval records the version it used.
policy_version: "2026-11-26.1"

# Team charged for idle GPUs in each stage (ADR-0009). Names are free text and appear on dashboards.
#   PROVISIONING      in server-scan, not yet a working node in a target cluster
#   GPU_PLATFORM      a node in the cluster whose GPUs can't be used yet
#   EMPTY             healthy, ready GPUs with nothing running on them
#   SERVING           served vLLM models with too few requests, or not starting
#   MACHINE_LEARNING  Run:ai and every other workload whose GPUs are barely busy, or not starting
teams:
  PROVISIONING: Redbull
  GPU_PLATFORM: POPAI
  EMPTY: Samurai
  SERVING: Apply
  MACHINE_LEARNING: Machine Learning

# Idle time in a stage beyond its objective counts as overdue.
# ASSUMPTION (AGENT.md I1, not yet approved): Redbull 2 d, POPAI 1 d, Samurai 1 d, Apply 7 d, ML 1 d.
stage_objectives:
  PROVISIONING: 2d
  GPU_PLATFORM: 1d
  EMPTY: 1d
  SERVING: 7d
  MACHINE_LEARNING: 1d

# Target GPU clusters. Names must equal server-scan's openshift.cluster_name (probe P-SS-2 lists them).
target_clusters:
  - ocp4-prod-gpu-site1

# health.overall values that count as critical hardware (ADR-0002 row 6b).
critical_health_values: [CRITICAL]

# Intentional exclusions (AGENT.md I5): lab, teaching, cold spare. Excluded GPUs are never charged.
exclusions:
  asset_ids: []
  serverscan_names: []

# --- Target-cluster rules (ADR-0002 rows 15-22). Every key below is optional; the values shown are the
# --- defaults built into the engine. Copy a block only to change it, and bump policy_version when you do.

# Serving (ADR-0002 rows 16b-20, ADR-0009). The engine reads each serving pod's own /metrics through the
# kube API pod proxy (the reader needs get on pods/proxy) and adds up `metric` per deployment; prefill pods
# are skipped because they count every request a second time. A model is waste when it gets fewer than
# useful_requests_per_gpu_hour requests per GPU per hour over demand_window (or since it started).
# 1 request per GPU per hour was chosen on 2026-11-25 (AGENT.md I2, provisional); null turns LOW_USE off.
# serving:
#   demand_window: 24h
#   recent_window: 1h                       # shown next to it, for "quiet" models
#   warmup_grace: 30m
#   useful_requests_per_gpu_hour: 1
#   metric: "vllm:request_success_total"
#   metrics_port: null                      # null: the pod's port named metrics, else its vLLM port, else 8000
#   role_label: llm-d.ai/role
#   skip_roles: [prefill]
#   kinds:                                  # top owners that make a pod a served model
#     - {group: serving.kserve.io, kind: LLMInferenceService}
#     - {group: serving.kserve.io, kind: InferenceService}
#     - {group: apps, kind: Deployment, image_pattern: vllm}   # plain vLLM Deployments, by image

# Machine Learning: any pod whose top owner is in this API group is Run:ai's; Run:ai and every other
# non-serving workload are judged by GPU utilization below.
# runai:
#   group: run.ai

# GPU utilization rule: a Machine Learning pod older than `window` whose GPUs were never above `threshold`
# busy during `window` is waste (row 21). Serving pods only get the allocated_idle flag from it.
# allocated_idle:
#   window: 6h
#   threshold: 0.05

# GPU power as a second sign of work (ADR-0009), as a share of each GPU's rated power: its DCGM power limit
# when exported, else the first `ratings` entry whose regex matches DCGM's modelName.
#   Machine Learning: waste only when the GPUs were never above allocated_idle.threshold busy AND never drew
#                     `threshold` of rated power during allocated_idle.window.
#   Served models:    enough requests but a demand_window average under `threshold` is still LOW_USE.
#   Empty GPUs:       a GPU no pod holds whose peak reaches `threshold` is POWER_WITHOUT_POD (UNKNOWN).
# 25% was chosen on 2026-11-26 (provisional): an idle H100 draws about 70-120 W of 700 W, even with a model loaded.
# power:
#   threshold: 0.25                          # null turns power off
#   ratings:                                 # first match wins; the defaults cover B300 ... T4
#     - {pattern: "H100 PCIe", watts: 350}
#     - {pattern: "H100", watts: 700}

# Node pools recorded on intervals: the first matching node selector names the pool.
pools: []
#  - name: runai-h100
#    node_selector: {node-role.kubernetes.io/runai: ""}

# Consuming team of productive GPUs (for adoption views). Unmapped → "unassigned".
team_map:
  workloads: {}     # "namespace/Kind/name": team
  namespaces: {}    # namespace: team

