# Business policy for the GPU Time-to-Value engine. Validated at startup; an invalid file stops the engine.
# Bump policy_version whenever anything below changes: every ledger interval records the version it used.
policy_version: "2026-10-30.1"

# Team that owns each stage (AGENT.md §0.1). Names are free text and appear on dashboards.
teams:
  PRE_PROVISIONING: DC
  PROVISIONING: Redbull
  GPU_PLATFORM: POPAI
  SERVING: Serving

# Idle time in a stage beyond its objective counts as overdue.
# ASSUMPTION (AGENT.md I1, not yet approved): DC 3 d, Redbull 2 d, POPAI 1 d, Serving 7 d.
stage_objectives:
  PRE_PROVISIONING: 3d
  PROVISIONING: 2d
  GPU_PLATFORM: 1d
  SERVING: 7d

# Target GPU clusters. Names must equal server-scan's openshift.cluster_name (probe P-SS-2 lists them).
target_clusters:
  - ocp4-prod-gpu-site1

# health.overall values that count as critical hardware (ADR-0002 row 6b).
critical_health_values: [CRITICAL]

# Intentional exclusions (AGENT.md I5): lab, teaching, cold spare. Excluded GPUs are never charged.
exclusions:
  asset_ids: []
  serverscan_names: []

# --- Target-cluster rules (ADR-0002 rows 15-22). Every key below is optional; the values shown are the
# --- defaults built into the engine. Copy a block only to change it, and bump policy_version when you do.

