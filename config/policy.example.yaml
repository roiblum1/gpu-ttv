# Run:ai kinds that are productive by presence (§0.2); interactive work is idle (C6). Verify with probe R5.
# runai:
#   group: run.ai
#   productive_kinds: [TrainingWorkload, DistributedWorkload, InferenceWorkload, DistributedInferenceWorkload, RunaiJob]
#   interactive_priority_classes: [build]
#   priority_label: priorityClassName

# allocated_idle flag (§20.2 Flags): productive GPUs below 5% activity for 6 h.
# allocated_idle:
#   window: 6h
#   threshold: 0.05

# Node pools recorded on intervals: the first matching node selector names the pool.
pools: []
#  - name: runai-h100
#    node_selector: {node-role.kubernetes.io/runai: ""}

# Consuming team of productive GPUs (for adoption views). Unmapped → "unassigned".
team_map:
  workloads: {}     # "namespace/Kind/name": team
  namespaces: {}    # namespace: team

# Profile-less collector (ADR-0002 rows 3-5). A bound profile whose name matches the pattern is an OCP
# profile (case-sensitive re.search, the same rule server-scan's collectors use; verify with probe P-SS-1).
# collector:
#   ocp_profile_pattern: "^ocp"
#   handover_grace: 6h          # an OCP-profile GPU server missing from server-scan longer than this is flagged
