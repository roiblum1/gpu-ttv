# Data sources for the GPU Time-to-Value dashboards (stable UIDs; dashboards reference them by uid).
# Every value comes from the environment when Grafana starts; see grafana/README.md for the variables.
apiVersion: 1

datasources:
  - name: TTV Ledger (Postgres)
    uid: ttv-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: ${TTV_PG_HOST}
    user: ${TTV_PG_USER}
    editable: false
    jsonData:
      database: ${TTV_PG_DB}
      sslmode: ${TTV_PG_SSLMODE}
      tlsConfigurationMethod: file-path
      sslRootCertFile: ${TTV_PG_SSLROOTCERT}
      postgresVersion: 1500
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: ${TTV_PG_PASSWORD}

  - name: TTV Metrics (Prometheus)
    uid: ttv-prometheus
    type: prometheus
    access: proxy
    url: ${TTV_PROM_URL}
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s
