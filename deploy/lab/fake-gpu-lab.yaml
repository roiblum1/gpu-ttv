---
apiVersion: v1
kind: Service
metadata:
  name: chat-busy
  namespace: ttv-lab
  labels: {ttv-lab/fake-vllm: "true"}
spec:
  selector: {app: chat-busy}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: chat-idle
  namespace: ttv-lab
  labels: {ttv-lab/fake-vllm: "true"}
spec:
  selector: {app: chat-idle}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fake-vllm
  namespace: ttv-lab
spec:
  selector: {matchLabels: {ttv-lab/fake-vllm: "true"}}
  endpoints: [{port: http, path: /metrics, interval: 30s}]
---
# A "notebook" holding a GPU and doing nothing: OTHER_WORKLOAD (row 21). Bare pods get an explicit
# non-root UID: created directly they are admitted without a namespace-assigned UID.
apiVersion: v1
kind: Pod
metadata:
  name: notebook
  namespace: ttv-lab
spec:
  nodeSelector: {kubernetes.io/hostname: worker-cluster-64spr-1}
  containers:
    - name: notebook
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: 10m, memory: 16Mi, nvidia.com/gpu: "1"}
        limits: {memory: 32Mi, nvidia.com/gpu: "1"}
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
---
# A crash-looping pod holding a GPU: WORKLOAD_NOT_READY once past warmup_grace (row 20).
apiVersion: v1
kind: Pod
metadata:
  name: crashloop
  namespace: ttv-lab
spec:
  nodeSelector: {kubernetes.io/hostname: worker-cluster-64spr-1}
  containers:
    - name: app
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      command: ["sh", "-c", "echo 'CUDA error: no device found (lab)'; exit 1"]
      resources:
        requests: {cpu: 10m, memory: 16Mi, nvidia.com/gpu: "1"}
        limits: {memory: 32Mi, nvidia.com/gpu: "1"}
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
