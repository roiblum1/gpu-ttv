apiVersion: v2
name: gpu-ttv-cluster-reader
description: >-
  Read-only access for gpu-ttv on one target GPU cluster (AGENT.md §20.8): a ServiceAccount,
  get/list/watch on the kinds the engine reads, get on pods/proxy for vLLM /metrics,
  cluster-monitoring-view, and a long-lived token.
type: application
# 0.2.0 added get on pods/proxy (podMetrics.enabled, ADR-0009).
version: 0.2.0
appVersion: "0.2.0"
