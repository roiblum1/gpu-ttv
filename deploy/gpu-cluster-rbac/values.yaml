# One release per target GPU cluster, installed by that cluster's platform owners (README.md here).
# Every rule gets the verbs get, list and watch, fixed in the template; values cannot add others.

serviceAccount:
  name: gpu-ttv-reader

# Built-in kinds the engine reads: nodes and pods (AGENT.md §20.3), the ownerReferences walk
# (approved 2026-10-28, docs/discovery.md) and clusterversions for the cluster_id check.
builtinKinds:
  - apiGroup: ""
    resources: [nodes, pods, namespaces]
  - apiGroup: apps
    resources: [replicasets, deployments, statefulsets]
  - apiGroup: batch
    resources: [jobs]
  - apiGroup: config.openshift.io
    resources: [clusterversions]

# CRD kinds present on this cluster (Run:ai, KServe, LeaderWorkerSet, Kubeflow, Knative), generated by
# ./discover-kinds.sh from `oc api-resources`. Never typed by hand: CRD names differ between
# versions and clusters, and Run:ai is installed on some target clusters only.
discoveredKinds: []
# - apiGroup: run.ai
#   resources: [<from discover-kinds.sh>]

# Thanos querier access (docs/discovery.md D11): the platform's read-only monitoring role.
monitoringClusterRole: cluster-monitoring-view

# A kubernetes.io/service-account-token Secret: the token controller fills it, and its token does
# not expire. gpu-ttv mounts a copy of token and ca.crt (deploy/helm/gpu-ttv, clusters[].tokenSecret).
tokenSecret:
  create: true
