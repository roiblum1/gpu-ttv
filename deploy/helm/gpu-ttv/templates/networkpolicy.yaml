{{- if .Values.networkPolicy.enabled -}}
{{- $egress := .Values.networkPolicy.egress -}}
# The engine accepts its port from the listed peers only; egress, when listed, adds DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gpu-ttv.fullname" . }}-engine
  labels:
    {{- include "gpu-ttv.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gpu-ttv.selectorLabels" (dict "ctx" . "component" "engine") | nindent 6 }}
  policyTypes: {{ toJson (ternary (list "Ingress" "Egress") (list "Ingress") (not (empty $egress))) }}
  ingress:
    - ports:
        - port: {{ .Values.engine.port }}
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $egress }}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
        - {port: 5353, protocol: UDP}
        - {port: 5353, protocol: TCP}
    {{- toYaml $egress | nindent 4 }}
  {{- end }}
{{- end }}
