{{- if .Values.serviceAccount.create }}
# The pods never call their own cluster's API (target clusters use their own tokens), so no RBAC
# is bound here and no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gpu-ttv.serviceAccountName" . }}
  labels:
    {{- include "gpu-ttv.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
