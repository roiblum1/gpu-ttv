# On a vX.Y.Z tag: the gate, then the gpu-ttv image on GHCR (linux/amd64, by digest) and both Helm
# charts pointing at that digest on one GitHub Release; no offline bundle (ADR-0007).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write  # the GitHub Release
      packages: write  # ghcr.io/<owner>/gpu-ttv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"

      - name: Tag, app and chart versions agree
        run: |
          version=${GITHUB_REF_NAME#v}
          app=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          chart=$(sed -n 's/^version: *//p' deploy/helm/gpu-ttv/Chart.yaml)
          app_chart=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' deploy/helm/gpu-ttv/Chart.yaml)
          if [ "$version" != "$app" ] || [ "$version" != "$chart" ] || [ "$version" != "$app_chart" ]; then
            echo "::error::tag $GITHUB_REF_NAME, pyproject $app, chart $chart and appVersion $app_chart must agree"
            exit 1
          fi
          {
            echo "VERSION=$version"
            echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gpu-ttv"
            echo "DIST=$RUNNER_TEMP/dist"
          } >> "$GITHUB_ENV"

      - name: Build the image
        run: |
          podman build --platform linux/amd64 \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$VERSION" .

      - name: Push it to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman push --digestfile "$RUNNER_TEMP/digest" "$IMAGE:$VERSION"
          echo "DIGEST=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_ENV"

      - name: Package the charts, pointed at the pushed digest
        run: |
          offline/set-chart-image.sh deploy/helm/gpu-ttv/values.yaml ghcr.io "${IMAGE#ghcr.io/}" "$DIGEST"
          mkdir -p "$DIST"
          helm package deploy/helm/gpu-ttv -d "$DIST"
          helm package deploy/gpu-cluster-rbac -d "$DIST"
          printf 'image:\n  registry: ghcr.io\n  repository: %s\n  digest: "%s"\n' "${IMAGE#ghcr.io/}" "$DIGEST" \
            > "$DIST/values-image.yaml"
          (cd "$DIST" && sha256sum -- * > SHA256SUMS)
          ls -l "$DIST"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          **Image:** \`$IMAGE@$DIGEST\` (tag \`$VERSION\`, linux/amd64). The \`gpu-ttv-$VERSION.tgz\` chart already points at it.

          **Install:** \`helm upgrade --install gpu-ttv gpu-ttv-$VERSION.tgz -n gpu-ttv -f values-production.yaml\`.
          From an internal registry, copy the image there by digest first and add \`--set image.registry=<internal registry>\`.
          The release carries no offline bundle; \`offline/make-bundle.sh\` builds one when you need it (\`offline/README.md\`).
          EOF
          gh release create "$GITHUB_REF_NAME" --title "gpu-ttv $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "$DIST/"*
